services:
  db:
    image: postgres:15-alpine
    container_name: stats_pg
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: stats_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - stats_network

  stats_app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stats_app
    ports:
      - "8080:8080"
    environment:
      - APP_ENV=dev
      - DB_URL=postgres://user:password@db:5432/stats_db?sslmode=disable
      - PORT=8080
    depends_on:
      - db
    networks:
      - stats_network

volumes:
  postgres_data:

networks:
  stats_network:
    driver: bridge