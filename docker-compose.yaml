services:
  db:
    image: postgres:15-alpine
    container_name: stats_pg
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: stats_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - stats_network
volumes:
  postgres_data:

networks:
  stats_network:
    driver: bridge